<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Register</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #eee;
        }
        .card {
            border-radius: 25px;
        }
        .form-outline {
            width: 100%;
        }
    </style>
</head>

<body>
<section class="vh-100 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card">
          <div class="card-body p-5">
            <div class="row">
              
              <!-- Left Side: Registration Form -->
              <div class="col-md-6">
                <h2 class="text-center fw-bold mb-4">Register</h2>



<form action="/admin/registeradmin" method="POST">
  <div class="mb-3">
    <label class="form-label"><i class="fas fa-user me-2"></i> Your Name</label>
    <input type="text" class="form-control" name="name" required>
  </div>

  <div class="mb-3">
    <label class="form-label"><i class="fas fa-envelope me-2"></i> Your Email</label>
    <input type="email" class="form-control" name="email" required>
  </div>

  <div class="mb-3">
    <label class="form-label"><i class="fas fa-lock me-2"></i> Password</label>
    <input type="password" class="form-control" name="password" required>
  </div>

  <button type="submit" class="btn btn-primary w-100">Register</button>
</form>

                
                
                
                
                
                
                
                
                
                
                
                
                
                
              </div>

              <!-- Right Side: Image -->
              <div class="col-md-6 d-flex align-items-center">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                  class="img-fluid rounded" alt="Registration Image">
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
