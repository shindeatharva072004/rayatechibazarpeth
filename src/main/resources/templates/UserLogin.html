<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: url('https://marathischool.in/wp-content/uploads/2021/05/Untitled-design-7.png') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.9); 
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
            color: #333333;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
            
        }

        label {
            font-size: 0.9rem;
            color: #666666;
            display: block;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            background: #4CAF50;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: #45a049;
        }

        .signup-link {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #333333;
        }

        .signup-link a {
            color: #4CAF50;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
    <form action="/users/login" method="POST">
   
        <h1>Login</h1>
        <div class="form-group">
        
        <label for="Email">Email</label>
       
     <input type="email" name="email" placeholder="Enter Email" required>
     </div>
     <div class="form-group">
    
    
        <label for="password">Password</label>
     <input type="password" name="password" placeholder="Enter Password" required>
      </div>
    <button type="submit" class="btn">Login</button>
     <p class="signup-link">Don't have an account? <a href="#">Sign up</a></p>
        </form>
    
 
    </div>
</body>
</html>
