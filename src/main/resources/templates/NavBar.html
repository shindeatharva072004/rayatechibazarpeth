<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Nav Bar</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 10px 20px;
      color: white;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo {
      width: 40px;
      height: 40px;
      margin-right: 10px;
    }

    .website-name {
      font-size: 24px;
      font-weight: bold;
    }

    .search-container {
      flex-grow: 1;
      display: flex;
      justify-content: center;
    }

    /* Reduced width of the search bar */
    .search-bar {
      width: 200px; /* Adjusted width to a fixed value */
      padding: 8px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 4px;
    }

    .navbar-right {
      display: flex;
      align-items: center;
    }

    .cart-link {
      margin-right: 20px;
      text-decoration: none;
      color: white;
      font-size: 18px;
    }

    .cart-link:hover {
      color: #ff7f50;
    }

    .user-name {
      font-size: 18px;
      font-weight: normal;
    }
  </style>
</head>
<div th:fragment="navbar">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <div class="d-flex align-items-center">
            <img th:src="@{/image/R.jpg}" alt="Rayat Image" class="me-3" style="width:40px; height:40px;">
            <a class="navbar-brand fw-bold" href="#">Rayatechibazarpeth</a>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/cart/fetchcart">View Cart</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Details</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </div>
    <div style="float:right">Welcome <span th:text="${user}"></span></div>
  </nav>
</div>

</body>
</html>
