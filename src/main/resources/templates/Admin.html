<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Rayatechibazarpeth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #343a40;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 90vh;
            overflow: hidden;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
        }
        .overlay-content h1 {
            font-size: 2rem;
            font-weight: bold;
        }
        .btn-custom {
            margin: 10px;
            padding: 10px 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Admin Panel - Rayatechibazarpeth</a>
        </div>
    </nav>

    <!-- Video Background -->
    <div class="video-container">
        <video autoplay loop muted>
            <source th:src="@{/images/video2.mp4}" type="video/mp4">
        </video>
        <div class="overlay-content">
            <h1>Welcome to Rayatechibazarpeth Admin Panel</h1>
            <a href="/admin/login" class="btn btn-primary btn-custom">Login</a>
            <a href="/admin/registeradmin" class="btn btn-light btn-custom">Register</a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 text-center">
        <p>&copy; 2025 Rayatechibazarpeth. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
